<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gridfinity Labels</title>
    <meta name="description" content="Design 3D-printable labels for Gridfinity bins, in your browser." />
  </head>
  <body>
    <main class="app">
      <aside class="panel">
        <header>
          <h1>Gridfinity Labels</h1>
          <p class="sub">Cullenect label, ready for multi-colour printing.</p>
        </header>

        <section>
          <h2>Label</h2>
          <label class="field">
            <span>Bin width</span>
            <div class="segmented" id="units">
              <button type="button" data-value="1">1U</button>
              <button type="button" data-value="2">2U</button>
              <button type="button" data-value="3">3U</button>
            </div>
          </label>
          <p class="hint" id="size-hint"></p>
          <label class="check">
            <input type="checkbox" id="ribs" />
            <span>Snap-fit channels on the back <small>(1U only)</small></span>
          </label>
        </section>

        <section>
          <h2>Text</h2>
          <label class="field">
            <span>Text <small>(one line per row)</small></span>
            <textarea id="text" rows="2" spellcheck="false"></textarea>
          </label>
          <div class="row">
            <label class="field">
              <span>Align</span>
              <div class="segmented" id="align">
                <button type="button" data-value="left">Left</button>
                <button type="button" data-value="center">Center</button>
                <button type="button" data-value="right">Right</button>
              </div>
            </label>
            <label class="field">
              <span>Weight</span>
              <div class="segmented" id="weight">
                <button type="button" data-value="regular">Regular</button>
                <button type="button" data-value="bold">Bold</button>
              </div>
            </label>
          </div>
          <label class="field">
            <span>Max letter height <output id="cap-out"></output></span>
            <input type="range" id="cap" min="2" max="9" step="0.1" />
          </label>
          <p class="hint" id="cap-hint"></p>
        </section>

        <section>
          <h2>Print style</h2>
          <div class="segmented" id="style">
            <button type="button" data-value="embedded">Flush</button>
            <button type="button" data-value="raised">Raised</button>
          </div>
          <p class="hint" id="style-hint"></p>
          <label class="field">
            <span>Text depth <output id="depth-out"></output></span>
            <input type="range" id="depth" min="0.1" max="1" step="0.1" />
          </label>
          <div class="row colors">
            <label class="color"><input type="color" id="base-color" /><span>Label</span></label>
            <label class="color"><input type="color" id="text-color" /><span>Text</span></label>
          </div>
        </section>

        <section class="export">
          <button type="button" class="primary" id="dl-3mf">Download 3MF</button>
          <button type="button" id="dl-stl">STL (zip)</button>
        </section>

        <footer>
          Label geometry from <a href="https://github.com/ndevenish/gflabel">gflabel</a> (BSD-3).
          Cullenect system by <a href="https://makerworld.com/en/models/446624">Cullen J Webb</a>.
        </footer>
      </aside>
      <section class="viewer">
        <div id="preview"></div>
        <div class="status" id="status">Loading…</div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
